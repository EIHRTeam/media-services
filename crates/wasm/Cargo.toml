[package]
name = "media-services-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "WebAssembly bindings for the media-services XMP + C2PA package"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
provenance = { path = "../provenance" }
xmp-image = { path = "../xmp-image" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `Window` is deliberately absent: the transport goes through `globalThis.fetch`
# so the same module works in a page, a worker and Node.
web-sys = { version = "0.3", features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
] }
console_error_panic_hook = "0.1"
